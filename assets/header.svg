<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Rabi Raj Yadav, product builds workshop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#1a1610"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1d2230" stroke-width="1"/>
    </pattern>
    <style>
      .name{font:700 52px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#e6ebf5;letter-spacing:-1px}
      .role{font:500 20px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#93a0b8}
      .mono{font:500 16px 'JetBrains Mono',Consolas,'Courier New',monospace;fill:#f59e0b}
      .dim{fill:#5d6b85}
      .edge{stroke:#3a3426;stroke-width:1.6}
      .blk{fill:#0b0f17;stroke:#f59e0b;stroke-width:2}
      .blk2{fill:#0b0f17;stroke:#2dd4bf;stroke-width:2}
      .cursor{animation:blink 1.1s steps(1) infinite}
      .rise{animation:rise 4s ease-in-out infinite}
      .rise.d1{animation-delay:.6s}.rise.d2{animation-delay:1.2s}.rise.d3{animation-delay:1.8s}
      @keyframes blink{50%{opacity:0}}
      @keyframes rise{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>

  <!-- a build stack: data at the base, services, then interfaces on top -->
  <g>
    <path class="edge" d="M870 210V170M990 210V170M1110 210V170M870 130V95M990 130V95M1110 130V95M870 210H1110"/>
    <rect class="blk rise" x="820" y="210" width="340" height="44" rx="8"/>
    <rect class="blk2 rise d1" x="820" y="130" width="100" height="40" rx="8"/>
    <rect class="blk2 rise d2" x="940" y="130" width="100" height="40" rx="8"/>
    <rect class="blk2 rise d3" x="1060" y="130" width="100" height="40" rx="8"/>
    <rect class="blk rise d2" x="820" y="55" width="160" height="40" rx="8"/>
    <rect class="blk rise d3" x="1000" y="55" width="160" height="40" rx="8"/>
    <text x="990" y="237" text-anchor="middle" class="mono" style="font-size:13px;fill:#93a0b8">postgres · supabase · pgvector</text>
    <text x="870" y="155" text-anchor="middle" class="mono" style="font-size:13px;fill:#2dd4bf">go</text>
    <text x="990" y="155" text-anchor="middle" class="mono" style="font-size:13px;fill:#2dd4bf">kafka</text>
    <text x="1110" y="155" text-anchor="middle" class="mono" style="font-size:13px;fill:#2dd4bf">edge fn</text>
    <text x="900" y="80" text-anchor="middle" class="mono" style="font-size:13px">react</text>
    <text x="1080" y="80" text-anchor="middle" class="mono" style="font-size:13px">flutter</text>
    <circle r="4" fill="#2dd4bf"><animateMotion dur="2.4s" repeatCount="indefinite" path="M870 210V170"/></circle>
    <circle r="4" fill="#f59e0b"><animateMotion dur="2.9s" repeatCount="indefinite" path="M990 130V95"/></circle>
    <circle r="4" fill="#2dd4bf"><animateMotion dur="2.1s" repeatCount="indefinite" path="M1110 210V170"/></circle>
  </g>

  <!-- identity -->
  <text x="64" y="92" class="mono"><tspan class="dim">~/workshop $</tspan> ls ./builds</text>
  <text x="62" y="160" class="name">Rabi Raj Yadav</text>
  <text x="64" y="198" class="role">Product builds · commerce · telecom tooling · civic data</text>
  <text x="64" y="246" class="mono">from schema to storefront to the phone in your hand<tspan class="cursor"> ▌</tspan></text>
</svg>
